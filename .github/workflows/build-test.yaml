name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    strategy:
      matrix:
        include:
          - os: macOS-15
            swift: '6.2'
          - os: ubuntu-24.04
            swift: '6.2'
    runs-on: ${{ matrix.os }}

    steps:
    - uses: SwiftyLab/setup-swift@v1
      with:
        swift-version: ${{ matrix.swift }}

    - name: Install ZeroMQ dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libzmq3-dev libsodium-dev

    - name: Checkout
      uses: actions/checkout@v4

    - name: Build
      run: swift build

    - name: Test
      run: swift test
